<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>¿Cuánto me amas?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;600&display=swap');

  :root{
    --bg: #fbe6ec;
    --bg2: #fdeef2;
    --ink: #7a1f3d;
    --line: #2b1620;
    --heart: #d81b5f;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(180deg, #fdeef2 0%, #fbe0e8 100%);
    font-family:'Poppins', sans-serif;
    overflow:hidden;
  }

  .page-container{
    position:relative;
    width:100%;
    height:100vh;
    max-width: 500px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  /* Clase para ocultar elementos fácilmente */
  .hidden {
    display: none !important;
  }

  /* --- decorative floating doodles --- */
  .birds{
    position:absolute; top:8%; right:8%;
    font-size:26px;
    animation: bob 3s ease-in-out infinite;
  }
  .plane{
    position:absolute; left:5%; bottom:20%;
    font-size:30px;
    transform:rotate(-18deg);
    animation: floaty 4s ease-in-out infinite;
  }
  .trail{
    position:absolute; left:8%; bottom:18%;
    width:120px; height:70px;
    opacity:.5;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px) rotate(-4deg); }
  }
  @keyframes floaty{
    0%,100%{ transform:translateY(0) rotate(-18deg); }
    50%{ transform:translateY(-10px) rotate(-12deg); }
  }

  /* --- cat --- */
  .stage{
    width:220px; height:200px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:10px;
  }
  #catGif{
    max-width:190px;
    max-height:190px;
    filter: drop-shadow(0 8px 14px rgba(122,31,61,.18));
    animation: cat-idle 2.6s ease-in-out infinite;
  }
  @keyframes cat-idle{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-5px) rotate(-1.2deg); }
  }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:28px;
    color:var(--ink);
    margin:6px 0 2px;
    letter-spacing:.2px;
    text-align: center;
  }

  #pct{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:38px;
    color:var(--heart);
    margin:2px 0 2px;
    min-height:42px;
  }

  #phrase{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--ink);
    min-height:24px;
    margin-bottom:15px;
    transition: opacity .15s ease;
    text-align: center;
  }

  /* --- gauge --- */
  .gaugeWrap{ position:relative; width:300px; height:170px; margin-top:6px; }
  svg#gauge{ width:300px; height:170px; overflow:visible; }
  #needle{ transform-origin: 150px 150px; transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
  .loveLabel{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:22px;
    fill:#c2185b;
    font-style:italic;
  }

  /* --- slider --- */
  .sliderWrap{
    width: 85%;
    max-width: 320px;
    margin-top: 30px;
    display:flex; align-items:center; gap:8px;
  }
  input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:8px;
    border-radius:4px;
    background:linear-gradient(90deg, #f2a6bf, #d81b5f);
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:36px; 
    height:36px;
    border-radius:50%;
    background:#fff;
    border:5px solid var(--heart);
    box-shadow:0 3px 10px rgba(216,27,95,.4);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:36px; 
    height:36px;
    border-radius:50%;
    background:#fff;
    border:5px solid var(--heart);
    cursor:pointer;
  }

  /* --- Botón Siguiente --- */
  .btn-siguiente {
    margin-top: 20px;
    padding: 12px 30px;
    background-color: var(--heart);
    color: white;
    border: none;
    border-radius: 25px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 18px;
    box-shadow: 0 5px 15px rgba(216,27,95,.4);
    cursor: pointer;
    transition: transform 0.2s, background-color 0.2s;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .btn-siguiente:active {
    transform: scale(0.95);
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* --- Estilos de la Fase 2 (Regalos) --- */
  .gifts-wrap {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
    width: 100%;
    padding: 0 20px;
  }
  
  .gift-box {
    width: 140px;
    height: 140px;
    background: #fff;
    border: 4px dashed var(--heart);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Baloo 2', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(122,31,61,.15);
    transition: transform 0.2s, background-color 0.2s;
  }
  .gift-box:active {
    transform: scale(0.92);
    background-color: #ffe6ee;
  }
  .gift-icon {
    font-size: 45px;
    margin-bottom: 5px;
  }
  
  .btn-volver {
    margin-top: 40px;
    padding: 8px 20px;
    background: transparent;
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 20px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- PANTALLA PRINCIPAL (FASE 1) -->
<div class="page-container" id="screen1">

  <div class="birds">🐦💕🐦</div>
  <div class="plane">✈️</div>
  <svg class="trail" viewBox="0 0 120 70">
    <path d="M5 65 Q40 60 55 35 Q65 15 90 20" stroke="var(--heart)" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/>
    <path d="M78 12 c4 -8 14 -8 16 0 c2 8 -8 14 -16 20 c-8 -6 -18 -12 -16 -20 c2 -8 12 -8 16 0 z" fill="var(--heart)"/>
  </svg>

  <div class="stage">
    <img id="catGif" src="gif/01.gif" alt="gatito">
  </div>

  <h1>¿Cuánto me amas?</h1>
  <div id="pct">0%</div>
  <div id="phrase">Muévelo y descúbrelo 👀</div>

  <div class="gaugeWrap">
    <svg id="gauge" viewBox="0 0 300 170">
      <defs>
        <linearGradient id="segGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#fbcede"/>
          <stop offset="50%" stop-color="#ef6f9b"/>
          <stop offset="100%" stop-color="#a4123f"/>
        </linearGradient>
      </defs>

      <g id="segments" stroke-width="26" fill="none" stroke-linecap="butt"></g>

      <text x="26" y="130" font-size="18">🤍</text>
      <text x="258" y="130" font-size="18">❤️</text>
      <text x="150" y="118" text-anchor="middle" class="loveLabel">love</text>

      <g id="needle">
        <line x1="150" y1="150" x2="150" y2="55" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="150" cy="150" r="9" fill="var(--line)"/>
        <circle cx="150" cy="150" r="3.5" fill="#fff"/>
      </g>
    </svg>
  </div>

  <div class="sliderWrap">
    <input type="range" id="slider" min="0" max="100" value="0">
  </div>

  <!-- Botón que aparece al 100% -->
  <button id="btnNext" class="btn-siguiente hidden">¡Siguiente! ➡️</button>

</div>

<!-- PANTALLA SECUNDARIA (FASE 2) -->
<div class="page-container hidden" id="screen2">
  <h1>¡Sorpresa! 🎉</h1>
  <div id="phrase" style="margin-bottom: 30px;">Elige tu regalo especial...</div>

  <div class="gifts-wrap">
    <div class="gift-box" onclick="abrirRegalo(1)">
      <div class="gift-icon">🎁</div>
      Regalo 1
    </div>
    <div class="gift-box" onclick="abrirRegalo(2)">
      <div class="gift-icon">🎁</div>
      Regalo 2
    </div>
    <div class="gift-box" onclick="abrirRegalo(3)">
      <div class="gift-icon">🎁</div>
      Regalo 3
    </div>
  </div>

  <button id="btnBack" class="btn-volver">⬅️ Volver</button>
</div>

<script>
// Referencias Fase 1
const slider  = document.getElementById('slider');
const pctEl   = document.getElementById('pct');
const phraseEl= document.getElementById('phrase');
const needle  = document.getElementById('needle');
const segG    = document.getElementById('segments');
const catGif  = document.getElementById('catGif');
const btnNext = document.getElementById('btnNext');

// Referencias de Pantallas
const screen1 = document.getElementById('screen1');
const screen2 = document.getElementById('screen2');
const btnBack = document.getElementById('btnBack');

// --- build gauge segments ---
const cx=150, cy=150, r=95;
const colors = ['#fbcede','#f6aac6','#ef7fac','#e35590','#c22a68','#a4123f'];
function polar(cx,cy,r,angleDeg){
  const a = (angleDeg-180) * Math.PI/180;
  return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) };
}
const segCount = colors.length;
for(let i=0;i<segCount;i++){
  const startAngle = 180 - (180/segCount)*i;
  const endAngle   = 180 - (180/segCount)*(i+1);
  const p0 = polarPoint(startAngle);
  const p1 = polarPoint(endAngle);
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', `M ${p0.x} ${p0.y} A ${r} ${r} 0 0 1 ${p1.x} ${p1.y}`);
  path.setAttribute('stroke', colors[i]);
  path.setAttribute('stroke-width','26');
  path.setAttribute('fill','none');
  path.setAttribute('stroke-linecap','butt');
  segG.appendChild(path);
}
function polarPoint(angleDeg){
  const rad = angleDeg * Math.PI/180;
  return { x: cx + r*Math.cos(rad), y: cy - r*Math.sin(rad) };
}

// --- Textos actualizados según tu lista ---
const phrases = [
  {max:20,  text:"No me quieres?",       gif:'gif/01.gif'},
  {max:40,  text:"Vamos mejorando 😌",     gif:'gif/cat-neutral.gif'},
  {max:60,  text:"¡Eso ya me gusta! 💗",   gif:'gif/cat-heart.gif'},
  {max:80,  text:"¡Me encantas! 🥰",       gif:'gif/cat-hearts-flying.gif'},
  {max:100, text:"¡Esooooooo yupiiiii! 💖", gif:'gif/cat-couple-max.gif'},
];

let lastGif = '';
function setFace(val){
  const item = phrases.find(p=>val<=p.max) || phrases[phrases.length-1];
  phraseEl.textContent = item.text;
  if(item.gif !== lastGif){
    catGif.src = item.gif;
    lastGif = item.gif;
  }
}

function update(val){
  pctEl.textContent = val + '%';
  const rotation = (val/100)*180 - 90;
  needle.style.transform = `rotate(${rotation}deg)`;
  setFace(val);

  // Muestra u oculta el botón "Siguiente" si llega a 100
  if (val === 100) {
    btnNext.classList.remove('hidden');
  } else {
    btnNext.classList.add('hidden');
  }
}

slider.addEventListener('input', e => update(parseInt(e.target.value)));
update(0);

// --- Navegación entre pantallas ---
btnNext.addEventListener('click', () => {
  screen1.classList.add('hidden');
  screen2.classList.remove('hidden');
});

btnBack.addEventListener('click', () => {
  screen2.classList.add('hidden');
  screen1.classList.remove('hidden');
});

// --- Funciones para los regalos ---
function abrirRegalo(numero) {
  // Aquí puedes decidir qué hacer cuando toque un regalo
  alert("¡Acabas de elegir el Regalo " + numero + "! Preparando sorpresa...");
}
</script>

</body>
</html>
